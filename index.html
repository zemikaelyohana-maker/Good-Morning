<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Good Morning, Erutey 🌹</title>
    <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #2b0308, #590914, #800a1d);
            font-family: 'Poppins', sans-serif;
            overflow: hidden;
            position: relative;
            color: #fff;
        }

        /* Floating Petals Animation */
        .petal {
            position: absolute;
            background: radial-gradient(circle at 30% 30%, #ff4d6d, #c9184a);
            border-radius: 15px 0 15px 0;
            opacity: 0.7;
            pointer-events: none;
            animation: fall linear infinite;
        }

        @keyframes fall {
            0% {
                transform: translateY(-10vh) rotate(0deg) scale(0.8);
                opacity: 1;
            }
            100% {
                transform: translateY(105vh) rotate(360deg) scale(1.2);
                opacity: 0.2;
            }
        }

        /* Container Card */
        .card-container {
            position: relative;
            z-index: 10;
            width: 90%;
            max-width: 420px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 24px;
            padding: 35px 25px;
            text-align: center;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
            transition: transform 0.3s ease;
        }

        .title {
            font-size: 1.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #ffccd5;
            margin-bottom: 25px;
            font-weight: 300;
        }

        /* Interactive Box / Envelope */
        .box-wrapper {
            width: 140px;
            height: 140px;
            margin: 0 auto 30px auto;
            position: relative;
            cursor: pointer;
            perspective: 1000px;
        }

        .box {
            width: 100%;
            height: 100%;
            background: linear-gradient(145deg, #ff4d6d, #c9184a);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 10px 25px rgba(201, 24, 74, 0.5);
            transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            position: relative;
        }

        .box:hover {
            transform: scale(1.05) rotate(3deg);
        }

        .box-icon {
            font-size: 3.5rem;
            transition: transform 0.3s ease;
        }

        /* Button Styling */
        .btn-open {
            background: linear-gradient(45deg, #ff758f, #ff4d6d);
            border: none;
            padding: 14px 32px;
            color: white;
            font-size: 1rem;
            font-weight: 600;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 8px 20px rgba(255, 77, 109, 0.4);
            transition: all 0.3s ease;
            outline: none;
        }

        .btn-open:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 25px rgba(255, 77, 109, 0.6);
            background: linear-gradient(45deg, #ff4d6d, #ff758f);
        }

        .btn-open:active {
            transform: translateY(1px);
        }

        /* Revealed Message Styles */
        .message-content {
            display: none;
            opacity: 0;
            transform: translateY(15px);
            transition: all 0.6s ease;
        }

        .message-content.active {
            display: block;
            opacity: 1;
            transform: translateY(0);
        }

        .erutey-title {
            font-family: 'Great Vibes', cursive;
            font-size: 3.2rem;
            color: #fff0f3;
            margin-bottom: 10px;
            text-shadow: 0 0 15px rgba(255, 204, 213, 0.6);
        }

        .greeting-text {
            font-size: 1rem;
            line-height: 1.6;
            color: #ffccd5;
            font-weight: 300;
        }

        /* Sound Control */
        .audio-toggle {
            position: absolute;
            top: 15px;
            right: 15px;
            background: rgba(255, 255, 255, 0.15);
            border: none;
            color: white;
            padding: 8px 12px;
            border-radius: 20px;
            font-size: 0.8rem;
            cursor: pointer;
            backdrop-filter: blur(5px);
        }
    </style>
</head>
<body>

    <button class="audio-toggle" id="audioBtn">🎵 Sound On</button>

    <div class="card-container">
        <div class="title">💌 A Special Message</div>

        <!-- Interactive Box -->
        <div class="box-wrapper" id="boxWrapper">
            <div class="box" id="box">
                <div class="box-icon" id="boxIcon">🎁</div>
            </div>
        </div>

        <button class="btn-open" id="openBtn">Open Good Morning Box 🌹</button>

        <!-- Secret Message -->
        <div class="message-content" id="messageContent">
            <div class="erutey-title">My Lovely Erutey</div>
            <p class="greeting-text">
                Good morning, my sweet love! 🌹<br>
                May your day be as bright, beautiful, and wonderful as your lovely smile. Thinking of you always 💕
            </p>
        </div>
    </div>

    <script>
        // Generate Floating Rose Petals
        const petalCount = 20;
        for (let i = 0; i < petalCount; i++) {
            const petal = document.createElement('div');
            petal.className = 'petal';
            const size = Math.random() * 15 + 10;
            petal.style.width = `${size}px`;
            petal.style.height = `${size + 5}px`;
            petal.style.left = `${Math.random() * 100}vw`;
            petal.style.animationDuration = `${Math.random() * 5 + 5}s`;
            petal.style.animationDelay = `${Math.random() * 5}s`;
            document.body.appendChild(petal);
        }

        // DOM Elements
        const boxWrapper = document.getElementById('boxWrapper');
        const openBtn = document.getElementById('openBtn');
        const boxIcon = document.getElementById('boxIcon');
        const messageContent = document.getElementById('messageContent');
        const audioBtn = document.getElementById('audioBtn');

        let isOpen = false;
        let audioContext;

        // Reveal Interaction
        function revealMessage() {
            if (isOpen) return;
            isOpen = true;

            // Play Chime Sound
            playChimeSound();

            // Animate Box
            boxIcon.textContent = '💖';
            boxWrapper.style.transform = 'scale(1.1) rotate(-5deg)';

            setTimeout(() => {
                boxWrapper.style.display = 'none';
                openBtn.style.display = 'none';
                messageContent.classList.add('active');
                createHeartBurst();
            }, 600);
        }

        boxWrapper.addEventListener('click', revealMessage);
        openBtn.addEventListener('click', revealMessage);

        // Heart Burst Animation
        function createHeartBurst() {
            for (let i = 0; i < 15; i++) {
                const heart = document.createElement('div');
                heart.innerHTML = '💕';
                heart.style.position = 'absolute';
                heart.style.left = '50%';
                heart.style.top = '50%';
                heart.style.fontSize = `${Math.random() * 20 + 15}px`;
                heart.style.pointerEvents = 'none';
                heart.style.zIndex = '100';

                const x = (Math.random() - 0.5) * 250;
                const y = (Math.random() - 0.5) * 250;

                heart.animate([
                    { transform: 'translate(-50%, -50%) scale(0)', opacity: 1 },
                    { transform: `translate(${x}px, ${y}px) scale(1.5)`, opacity: 0 }
                ], {
                    duration: 1200,
                    easing: 'ease-out'
                });

                document.body.appendChild(heart);
                setTimeout(() => heart.remove(), 1200);
            }
        }

        // Web Audio Synthesizer (No external MP3 required)
        function playChimeSound() {
            try {
                const ctx = new (window.AudioContext || window.webkitAudioContext)();
                const notes = [523.25, 659.25, 783.99, 1046.50]; // C5, E5, G5, C6
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    osc.type = 'sine';
                    osc.frequency.value = freq;
                    gain.gain.setValueAtTime(0.1, ctx.currentTime + idx * 0.1);
                    gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + idx * 0.1 + 1);
                    osc.connect(gain);
                    gain.connect(ctx.destination);
                    osc.start(ctx.currentTime + idx * 0.1);
                    osc.stop(ctx.currentTime + idx * 0.1 + 1);
                });
            } catch (e) {
                console.log('Audio not supported');
            }
        }

        audioBtn.addEventListener('click', playChimeSound);
    </script>
</body>
</html>
